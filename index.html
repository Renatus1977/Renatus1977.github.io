<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renatus1977 的主页</title>
    <style>
        body {
            background: linear-gradient(135deg, #1e1e2f, #121212);
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            color: #58a6ff;
            font-size: 3rem;
            margin-bottom: 10px;
        }
        p {
            color: #a0a0a0;
            font-size: 1.2rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello, World! 👋</h1>
        <p>欢迎来到 Renatus1977 的赛博空间</p>
        <p>网站已成功部署在 GitHub Pages 上</p>
    </div>
</body>
</html>
